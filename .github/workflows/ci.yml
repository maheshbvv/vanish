name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --all --locked

  build:
    name: build (release, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      - name: static C toolchain
        if: contains(matrix.targets, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target" -p vanish-server -p vanish-client
          done
