name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Apple-silicon runner cross-compiles both darwin targets, so no
          # dependency on the scarce (and retiring) Intel macOS image.
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: static C toolchain
        if: contains(matrix.targets, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: commit
        run: echo "VANISH_GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target" -p vanish-server -p vanish-client
          done

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for target in ${{ matrix.targets }}; do
            name="vanish-${tag}-${target}"
            mkdir -p "dist/${name}"
            cp "target/${target}/release/vanish-server" "dist/${name}/"
            cp "target/${target}/release/vanish-client" "dist/${name}/"
            cp LICENSE README.md "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
            else
              (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
